name: Weekly Firestore Backup

on:
  schedule:
    # Every Sunday at 23:00 Japan time (14:00 UTC)
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@13

      - name: Export Firestore data
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/backup-firestore.mjs

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          openssl enc -aes-256-cbc -salt -pbkdf2             -in backup/hamawakiac-firestore-backup.json             -out backup/hamawakiac-firestore-backup.json.enc             -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm backup/hamawakiac-firestore-backup.json

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: hamawakiac-firestore-backup-${{ github.run_number }}
          path: backup/hamawakiac-firestore-backup.json.enc
          retention-days: 90
          if-no-files-found: error
