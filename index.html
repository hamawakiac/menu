<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浜脇AC│トレーニングメニュー</title>

<style>
:root{
  --emerald:#1d8fbf;
  --emerald-2:#3d9f7a;
  --emerald-3:#171717;
  --emerald-soft:#eef8fb;
  --bg:#f5f8f7;
  --panel:rgba(255,255,255,.92);
  --text:#16211d;
  --muted:#6b7280;
  --line:#dfe8e4;
  --danger:#dc2626;
  --shadow:0 18px 50px rgba(15,83,64,.10);
  --shadow-sm:0 8px 24px rgba(15,83,64,.08);
  --radius:20px;
  --overall:#3b82f6;
  --strength:#22c55e;
  --sprint:#ef4444;
  --hurdle:#f97316;
  --jump:#8b5cf6;
  --throw:#b7791f;
  --distance:#06b6d4;
  --drill:#64748b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at top left,rgba(16,185,129,.09),transparent 30%),
    radial-gradient(circle at top right,rgba(59,130,246,.07),transparent 28%),
    var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{
  position:sticky;
  top:0;
  z-index:30;
  backdrop-filter:blur(18px);
  background:linear-gradient(135deg,#1778a8 0%,#2f8f8b 42%,#78a93f 68%,#e0cf18 100%);
  color:#fff;
  box-shadow:0 8px 30px rgba(0,0,0,.24);border-bottom:5px solid #111;
}
.head{max-width:1500px;margin:auto;padding:14px 18px 12px}
.headtop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 4px rgba(0,0,0,.45)}
.status{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);font-size:12px
}
.dot{width:9px;height:9px;border-radius:50%;background:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.14)}
.dot.online{background:#86efac;box-shadow:0 0 0 4px rgba(134,239,172,.14)}
.dot.offline{background:#fca5a5;box-shadow:0 0 0 4px rgba(252,165,165,.14)}
nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;
  padding:5px;border-radius:15px;background:rgba(255,255,255,.08)
}
nav button{
  border:1px solid transparent;background:transparent;color:#eafff7;
  border-radius:11px;padding:10px 8px;font-weight:800;font-size:13px;
  transition:.2s ease
}
nav button:hover{background:rgba(255,255,255,.10)}
nav button.active{
  background:#f3df24;color:#111;
  box-shadow:0 8px 18px rgba(0,0,0,.13)
}
main{max-width:1500px;margin:auto;padding:22px 18px 36px}
.view{display:none}.view.active{display:block}
.panel{
  background:var(--panel);
  backdrop-filter:blur(12px);
  border:1px solid rgba(223,232,228,.95);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.panel h2{margin-top:0;font-size:21px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.builder{display:grid;grid-template-columns:300px 1fr;gap:18px}
.sticky{position:sticky;top:126px;align-self:start}
.field{margin-bottom:13px}
label{
  display:block;font-size:12px;font-weight:900;margin-bottom:6px;
  color:#35534a;letter-spacing:.03em
}
input,select,textarea{
  width:100%;border:1px solid #cadad4;border-radius:12px;
  padding:11px 12px;background:rgba(255,255,255,.96);color:var(--text);
  transition:.2s ease
}
textarea{min-height:88px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#9ed7c3}
input:focus,select:focus,textarea:focus{
  outline:0;border-color:var(--emerald);
  box-shadow:0 0 0 4px rgba(16,185,129,.13);
  background:#fff
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:11px;padding:10px 14px;font-weight:900;
  transition:.2s ease;box-shadow:none
}
.btn:hover{transform:translateY(-1px)}
.primary{
  background:linear-gradient(135deg,#1d8fbf,#4f9f62 58%,#d9c91d);
  color:#fff;box-shadow:0 8px 18px rgba(16,185,129,.22)
}
.primary:hover{box-shadow:0 12px 24px rgba(16,185,129,.28)}
.secondary{background:#eaf8f2;color:#08684d}
.secondary:hover{background:#dff5ec}
.danger{background:#fff1f2;color:var(--danger);border:1px solid #fecdd3}
.small{padding:7px 9px;font-size:12px}
.notice{
  background:linear-gradient(135deg,#effcf7,#f8fffc);
  border:1px solid #bcebd8;border-radius:14px;padding:12px 14px;
  margin-bottom:14px;color:#16624c;box-shadow:var(--shadow-sm)
}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;
  font-weight:900;font-size:12px;background:var(--soft);color:var(--cat);
  border:1px solid color-mix(in srgb,var(--cat) 22%,white)
}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--cat)}
.cat-overall{--cat:var(--overall);--soft:#e8f1ff}
.cat-strength{--cat:var(--strength);--soft:#e9fbea}
.cat-sprint{--cat:var(--sprint);--soft:#fff0f0}
.cat-hurdle{--cat:var(--hurdle);--soft:#fff3e8}
.cat-jump{--cat:var(--jump);--soft:#f3edff}
.cat-throw{--cat:var(--throw);--soft:#fff8df}
.cat-distance{--cat:var(--distance);--soft:#e6fbff}
.cat-drill{--cat:var(--drill);--soft:#f1f5f9}
.section{
  border:1px solid color-mix(in srgb,var(--cat) 23%,white);
  border-radius:16px;overflow:hidden;margin-bottom:14px;
  background:#fff;box-shadow:var(--shadow-sm)
}
.section h3{
  margin:0;padding:12px 14px;background:linear-gradient(90deg,var(--soft),#fff);
  color:var(--cat);font-size:15px;border-bottom:1px solid color-mix(in srgb,var(--cat) 18%,white)
}
.picker{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;background:#fbfefd}
.picker select{border-left:6px solid var(--cat);background:var(--soft)}
.items{padding:10px}
.item{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  border:1px solid color-mix(in srgb,var(--cat) 16%,white);
  border-left:6px solid var(--cat);
  background:linear-gradient(90deg,var(--soft),#fff 42%);
  padding:10px;border-radius:11px;margin-bottom:7px
}
.item small{color:var(--muted)}
.menu-list{display:grid;gap:12px}
.menu{
  position:relative;
  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  border:1px solid color-mix(in srgb,var(--cat) 18%,white);
  border-radius:16px;
  padding:0;overflow:hidden;background:#fff;
  box-shadow:var(--shadow-sm);
  transition:.2s ease
}
.menu:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(15,83,64,.12)}
.menu-rail{
  background:linear-gradient(180deg,color-mix(in srgb,var(--cat) 88%,white),var(--cat));
  color:#fff;display:flex;align-items:center;justify-content:center;
  padding:10px 4px;font-size:12px;font-weight:900;letter-spacing:.12em;
  writing-mode:vertical-rl;text-orientation:upright;min-height:138px
}
.menu-content{
  padding:15px 16px;
  background:linear-gradient(90deg,var(--soft),#fff 42%)
}
.menu h4{margin:0 0 7px;font-size:17px}
.meta{color:var(--muted);font-size:12px;margin:7px 0;line-height:1.6}

.today-board{
  display:grid;
  gap:18px;
  margin-top:16px;
}
.today-major{
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:#fff;
  box-shadow:var(--shadow-sm);
}
.today-major-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 17px;
  color:#fff;
  font-size:19px;
  font-weight:900;
  letter-spacing:.04em;
}
.today-major.overall .today-major-title{
  background:linear-gradient(135deg,#1778a8,#3f9a75 58%,#d5c91e);
  color:#fff;
}
.today-major.events .today-major-title{
  background:linear-gradient(135deg,#171717,#2f4858);
}
.today-major-count{
  min-width:30px;
  height:30px;
  padding:0 9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  font-size:12px;
}
.today-major-body{
  padding:13px;
  display:grid;
  gap:11px;
}
.today-subsection{
  border:1px solid color-mix(in srgb,var(--cat) 22%,white);
  border-left:7px solid var(--cat);
  border-radius:13px;
  overflow:hidden;
  background:linear-gradient(90deg,var(--soft),#fff 34%);
}
.today-subtitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  color:var(--cat);
  font-size:14px;
  font-weight:900;
  border-bottom:1px solid color-mix(in srgb,var(--cat) 17%,white);
}
.today-subitems{
  display:grid;
  gap:7px;
  padding:9px;
}
.today-menu-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:start;
  padding:9px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.88);
  border:1px solid color-mix(in srgb,var(--cat) 12%,white);
}
.today-menu-row strong{
  display:block;
  margin-bottom:3px;
}
.today-menu-row small{
  color:var(--muted);
  line-height:1.5;
}
.today-menu-time{
  white-space:nowrap;
  color:var(--cat);
  font-size:12px;
  font-weight:900;
  padding:4px 7px;
  border-radius:999px;
  background:var(--soft);
}
.today-empty-group{
  padding:14px;
  text-align:center;
  color:#98a2b3;
  border:1px dashed #cbd8d3;
  border-radius:11px;
  background:#fbfdfc;
}
.today-summary{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0 2px;
}
.today-summary span{
  padding:6px 10px;
  border-radius:999px;
  background:#f0f7f4;
  color:#35534a;
  font-size:12px;
  font-weight:800;
}
@media(max-width:700px){
  .today-major-title{font-size:17px;padding:12px 13px}
  .today-major-body{padding:9px}
  .today-menu-row{grid-template-columns:1fr}
  .today-menu-time{justify-self:start}
}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.filters{
  display:grid;grid-template-columns:240px 1fr;gap:10px;margin-bottom:13px;
  padding:12px;border-radius:14px;background:#f7fbf9;border:1px solid var(--line)
}
.empty{padding:18px;text-align:center;color:#98a2b3;border:1px dashed #c7d6d1;border-radius:12px;background:#fbfdfc}
.week-toolbar{
  display:grid;
  grid-template-columns:auto minmax(330px,1fr) auto;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}
.week-nav-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.week-nav-right{justify-content:flex-end}
.week-picker{
  display:grid;
  grid-template-columns:auto minmax(145px,180px) minmax(190px,1fr);
  align-items:center;
  gap:9px;
  margin:0;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(135deg,#f7fcfa,#edf8f4);
}
.week-picker-label{font-size:12px;font-weight:900;color:#35534a;white-space:nowrap}
.week-picker input{min-width:0;padding:8px 9px}
.week-picker strong{text-align:center;color:#173f34;font-size:14px;white-space:nowrap}
.week-wrap{
  min-height:360px;
  overflow-x:hidden;overflow-y:auto;max-height:calc(100vh - 230px);
  border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow-sm)
}
.week{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:0}
.week th,.week td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;vertical-align:top;min-width:0}
.week thead th{
  position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#f0fcf7,#e7f8f1);
  width:calc((100% - 138px)/7);color:#245548;font-size:11px
}
.week thead th:first-child{left:0;z-index:7;width:138px}
.week thead th input{padding:6px 5px;font-size:10px;min-width:0}
.week tbody th{
  position:sticky;left:0;z-index:4;width:138px;
  background:linear-gradient(90deg,var(--soft),#fff);
  color:var(--cat);border-left:5px solid var(--cat);font-weight:900;font-size:11px;line-height:1.35
}
.weekcell{min-height:94px;min-width:0}
.weekcell .picker{grid-template-columns:minmax(0,1fr) auto;gap:4px;padding:4px}
.weekcell .picker select{padding:6px 4px;font-size:10px;min-width:0;width:100%}
.weekcell .picker .btn{padding:6px 5px;font-size:10px}
.weekitem{font-size:10px;padding:5px 5px;word-break:break-word}
.weekitem{
  display:grid;grid-template-columns:1fr auto;gap:5px;
  background:linear-gradient(90deg,var(--soft),#fff);
  border:1px solid color-mix(in srgb,var(--cat) 18%,white);
  border-left:5px solid var(--cat);padding:6px 7px;border-radius:8px;
  margin-top:6px;font-size:12px;font-weight:800
}
.x{border:0;border-radius:6px;background:#fff;color:#b42318;font-weight:900}
.login{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(circle at top,rgba(29,143,191,.30),transparent 35%),linear-gradient(135deg,rgba(13,49,65,.92),rgba(22,22,22,.92));
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:18px
}
.login.hidden{display:none}
.loginbox{
  background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.7);
  border-radius:24px;padding:26px;width:min(440px,100%);
  box-shadow:0 28px 80px rgba(0,0,0,.28)
}
.loginbox h2{margin:0 0 6px;font-size:24px}
.muted{color:var(--muted)}

.entered-days-list{display:grid;gap:14px}
.entered-day-card{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff;box-shadow:var(--shadow-sm)}
.entered-day-card h3{margin:0 0 8px;font-size:17px}
.entered-day-groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entered-day-group{border:1px solid #dce8e3;border-radius:11px;padding:10px;background:#f9fcfb}
.entered-day-group strong{display:block;margin-bottom:5px;color:#255548}
.entered-day-group ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.month-toolbar{display:grid;grid-template-columns:auto minmax(330px,1fr) auto;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.month-nav-group{display:flex;gap:8px;align-items:center}.month-nav-right{justify-content:flex-end}
.month-picker{display:grid;grid-template-columns:auto 160px minmax(180px,1fr);gap:9px;align-items:center;margin:0;padding:7px 10px;border:1px solid var(--line);border-radius:13px;background:#f2faf7}
.month-picker span{font-size:12px;font-weight:900}.month-picker input{padding:8px}.month-picker strong{text-align:center;color:#234f43}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.month-weekday{padding:8px;text-align:center;font-weight:900;border-radius:9px;background:#eaf7f2;color:#235649}
.month-day{min-height:165px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.month-day.other{opacity:.3;background:#f3f4f6}.month-day.has-data{border-color:#7ccfb0;box-shadow:inset 0 0 0 1px #bcead8}
.month-day-head{display:flex;justify-content:space-between;align-items:center;gap:5px}.month-day-number{font-weight:900}.month-day-count{font-size:10px;padding:2px 6px;border-radius:999px;background:#e9f8f2;color:#087052;font-weight:900}
.month-day input,.month-day textarea{font-size:11px;padding:7px;border-radius:8px}.month-day textarea{min-height:46px}.month-day .btn{margin-top:auto;font-size:11px;padding:7px}
@media(max-width:1100px){.month-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.month-weekday{display:none}.month-toolbar{grid-template-columns:1fr}.month-nav-group,.month-nav-right{justify-content:space-between}.month-picker{grid-template-columns:auto 1fr}.month-picker strong{grid-column:1/-1}}
@media(max-width:650px){.month-grid{grid-template-columns:1fr 1fr}.entered-day-groups{grid-template-columns:1fr}}

@media(max-width:900px){
  nav{grid-template-columns:repeat(2,1fr)}
  .grid2,.builder{grid-template-columns:1fr}
  .sticky{position:static}
  .filters{grid-template-columns:1fr}
  .week-toolbar{grid-template-columns:1fr;gap:9px}
  .week-nav-group,.week-nav-right{justify-content:space-between}
  .week-picker{grid-template-columns:1fr;gap:5px}
  .week-picker strong{text-align:left;white-space:normal}
  .week-wrap{max-height:none;overflow-x:auto}
  .week{min-width:1120px;table-layout:fixed}
  .week thead th{width:140px;min-width:140px}
  .week thead th:first-child,.week tbody th{width:150px;min-width:150px}
  .menu{grid-template-columns:38px minmax(0,1fr)}
  .menu-rail{font-size:11px;min-height:118px}
  main{padding:15px 12px 28px}
  .panel{padding:15px;border-radius:16px}
}
/* Mobile form fit */
html,body{max-width:100%;overflow-x:hidden}
.field,input,select,textarea{min-width:0}
#dailyDate,#todayDate,#weekDate{
  max-width:100%;
  min-width:0;
  width:100%;
  box-sizing:border-box;
  display:block;
}
@media(max-width:700px){
  .builder{display:block}
  .builder>.panel,.builder>aside{width:100%;max-width:100%}
  .field{width:100%;max-width:100%}
  #dailyDate,#todayDate,#weekDate{
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    padding-left:14px;
    padding-right:14px;
  }
  input[type="date"]::-webkit-date-and-time-value{
    text-align:left;
    min-width:0;
  }
}

/* A4 print layout */


/* Unified A4 one-day print layout */
.print-prep{
  --print-scale:1;
}
.print-prep header,
.print-prep .login,
.print-prep .no-print,
.print-prep nav,
.print-prep #dayList,
.print-prep #enteredDaysPanel{
  display:none!important;
}
.print-prep main{
  width:196mm!important;
  max-width:196mm!important;
  margin:0 auto!important;
  padding:0!important;
}
.print-prep .view{display:none!important}
.print-prep #v-today.print{display:block!important}
.print-prep #v-today.print>.panel:first-child{
  display:block!important;
  width:196mm!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  background:#fff!important;
}
.print-prep #todayContent{
  width:196mm!important;
  margin:0 auto!important;
  zoom:var(--print-scale);
  background:#fff!important;
}
.print-prep #todayContent::before{
  content:'浜脇AC｜トレーニングメニュー';
  display:block;
  text-align:center;
  font-size:16pt;
  font-weight:900;
  margin:0 0 2.5mm;
  padding-bottom:3mm;
  border-bottom:2px solid #111;
}
.print-prep #todayContent>h2{
  text-align:center!important;
  font-size:12.5pt!important;
  margin:0 0 1.5mm!important;
  padding:0!important;
  border:0!important;
}
.print-prep #todayContent>h2::before{content:none!important}
.print-prep #todayContent p{font-size:8pt!important;margin:.7mm 0!important;line-height:1.2!important}
.print-prep .today-summary{margin:1mm 0!important;gap:1mm!important}
.print-prep .today-summary span{font-size:7pt!important;padding:.7mm 1.5mm!important}
.print-prep .today-board{gap:1.5mm!important;margin-top:1.5mm!important}
.print-prep .today-major{border-radius:1.8mm!important;box-shadow:none!important;border:1px solid #777!important;overflow:hidden!important}
.print-prep .today-major-title{font-size:9.5pt!important;padding:1.5mm 2.5mm!important}
.print-prep .today-major-count{height:auto!important;min-width:auto!important;font-size:6.5pt!important;padding:.3mm 1.2mm!important}
.print-prep .today-major-body{padding:1.2mm!important;gap:1mm!important}
.print-prep .today-subsection{border-radius:1.2mm!important}
.print-prep .today-subtitle{font-size:7.8pt!important;padding:.9mm 1.5mm!important}

</div>

 </div>
 <nav>
  <button class="active" data-view="today">📓 メニュー一覧</button>
  <button data-view="daily">✏️ 1日入力</button>

  <button data-view="menus">✏️ メニュー作成</button>
 </nav>
</div></header>

<main>
<section id="v-today" class="view active">
 <div class="panel">
  <div class="toolbar no-print"><input id="todayDate" type="date" style="width:auto"><div class="actions"><button id="editDay" class="btn secondary viewer-hide">この日を編集</button><button id="printDay" class="btn primary">印刷</button></div></div>
  <div id="todayContent"></div>
 </div>

</section>

<section id="v-daily" class="view">

   <div class="field"><label>日付</label><input id="dailyDate" type="date"></div>

   <div class="field"><label>連絡事項</label><textarea id="notes"></textarea></div>
   <div class="actions"><button id="saveDay" class="btn primary">保存</button><button id="copyPrev" class="btn secondary">前日コピー</button><button id="deleteDay" class="btn danger">削除</button></div>
  </aside>
  <div id="dailySections"></div>
 </div>
</section>

<section id="v-weekly" class="view">
 <div class="panel">
  <div class="week-toolbar no-print">
   <div class="week-nav-group">

   </div>

    <input id="weekDate" type="date">
    <strong id="weekTitle"></strong>
   </label>
   <div class="week-nav-group week-nav-right">
    <button id="saveWeek" class="btn primary">1週間を保存</button>
    <button id="nextWeek" class="btn secondary">次の週 →</button>
   </div>
  </div>
  <div class="week-wrap"><table class="week"><thead id="weekHead"></thead><tbody id="weekBody"></tbody></table></div>
 </div>
</section>

<section id="v-monthly" class="view">

  <div class="month-toolbar no-print">

   </div>

    <input id="monthDate" type="month">
    <strong id="monthTitle"></strong>
   </label>
   <div class="month-nav-group month-nav-right">
    <button id="saveMonth" class="btn primary">1か月を保存</button>
    <button id="nextMonth" class="btn secondary">次の月 →</button>
   </div>
  </div>
  <div class="month-grid" id="monthGrid"></div>

</section>

    <div class="field"><label>メニュー名</label><input id="name"></div>

    <div class="field"><label>内容</label><textarea id="detail"></textarea></div>

    <div class="field"><label>対象</label><input id="target"></div>
    <div class="field"><label>注意点</label><textarea id="caution"></textarea></div>
   </div>
  </div>
  <div class="actions"><button id="saveMenu" class="btn primary">保存</button><button id="resetMenu" class="btn secondary">リセット</button></div>

  <div class="filters no-print"><select id="filterCat"></select><input id="filterText" placeholder="検索"></div>
  <div id="menuList" class="menu-list"></div>

function blankDay(){const sections={};SECTIONS.forEach(s=>sections[s.id]=[]);return{theme:"",notes:"",sections,sectionMeta:{}}}
function normalizeDay(day){
 const base=blankDay();
 const src=(day&&typeof day==="object")?structuredClone(day):{};
 const sections=(src.sections&&typeof src.sections==="object")?src.sections:{};
 SECTIONS.forEach(s=>{
  if(!Array.isArray(sections[s.id]))sections[s.id]=[];
 });
 const sectionMeta=(src.sectionMeta&&typeof src.sectionMeta==="object")?src.sectionMeta:{};
 return{...base,...src,sections,sectionMeta};
}

function sectionChanged(beforeDay,afterDay,sectionId){

 const after=normalizeDay(afterDay).sections[sectionId]||[];
 return JSON.stringify(before)!==JSON.stringify(after);

function finalizeDayForSave(date,rawDay){

 SPECIALTY_SECTION_IDS.forEach(sectionId=>{
  if(sectionChanged(before,data,sectionId)){

 });

}

function parseISO(v){const [y,m,d]=String(v).split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function isoUTC(d){return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`}
function addDays(v,n){const d=parseISO(v);d.setUTCDate(d.getUTCDate()+n);return isoUTC(d)}
function getMonday(v){const d=parseISO(v),w=d.getUTCDay();d.setUTCDate(d.getUTCDate()-(w===0?6:w-1));return isoUTC(d)}

function mmToPx(mm){
 const probe=document.createElement("div");
 probe.style.cssText=`position:absolute;left:-9999px;top:-9999px;width:${mm}mm;height:1mm;visibility:hidden;`;
 document.body.appendChild(probe);
 const px=probe.getBoundingClientRect().width;
 probe.remove();
 return px;
}
function fitPrintPageToA4(page){
 const inner=page.querySelector(".print-page-inner");
 if(!inner)return;

 inner.style.setProperty("--content-scale","1");
 inner.style.setProperty("width","100%","important");
 void inner.offsetHeight;

 const maxH=mmToPx(279);
 const naturalH=Math.max(inner.scrollHeight,1);
 let scale=Math.min(1,maxH/naturalH);
 if(!Number.isFinite(scale)||scale<=0)scale=1;
 scale=Math.max(0.20,Math.floor(scale*1000)/1000);

 // Chromiumのzoomで縦だけ縮小し、元幅を逆補正して見た目を用紙幅いっぱいに保つ。
 inner.style.setProperty("--content-scale",String(scale));
 inner.style.setProperty("width",(100/scale)+"%","important");
 page.dataset.printScale=String(scale);
}
function prepareOnePagePrint(){

 const makePage=(major,index)=>{
  const page=document.createElement("section");
  page.className="print-page "+(index===0?"print-overall-page":"print-specialist-page");
  const headerParts=[];
  source.querySelectorAll(":scope > h2, :scope > p:not(.muted), :scope > .today-summary").forEach(n=>headerParts.push(n.outerHTML));
  const copy=major.cloneNode(true);
  const pageLabel=index===0?"全体練習メニュー":"専門練習メニュー";

    <div class="print-page-label">${pageLabel}</div>
    ${headerParts.join("")}
    <div class="today-board">${copy.outerHTML}</div>
  </div>`;
  // 連絡事項と最終更新は2ページ目の末尾にまとめる。
  if(index===1){
   const notice=source.querySelector(":scope > .notice");
   const muted=source.querySelector(":scope > p.muted");
   const inner=page.querySelector(".print-page-inner");
   if(notice)inner.insertAdjacentHTML("beforeend",notice.outerHTML);
   if(muted)inner.insertAdjacentHTML("beforeend",muted.outerHTML);
  }
  return page;
 };

function renderMenus(){
 const c=el("filterCat").value,q=el("filterText").value.toLowerCase(),list=menus.filter(m=>(!c||m.category===c)&&(!q||(m.name+" "+m.detail+" "+m.target).toLowerCase().includes(q)));
 el("menuList").innerHTML=list.length?list.map(m=>`<div class="menu ${cls(m.category)}"><div class="menu-rail">${esc(m.category.replace("全体練習メニュー","全体").replace("全体メニュー","全体").replace("メニュー",""))}</div><div class="menu-content"><h4>${esc(m.name)}</h4><span class="chip ${cls(m.category)}"><i></i>${esc(m.category)}</span>${m.detail?`<p>${esc(m.detail)}</p>`:""}<div class="meta">${esc([m.sets,m.intensity,m.rest,m.duration,m.target].filter(Boolean).join("／"))}</div><div class="actions"><button class="btn secondary small" onclick="editMenu('${m.id}')">編集</button><button class="btn danger small" onclick="deleteMenu('${m.id}')">削除</button></div></div></div>`).join(""):`<div class="empty">該当なし</div>`
}
el("filterCat").oninput=renderMenus;el("filterText").oninput=renderMenus;

function menuFormData(){
 return{id:el("editId").value||crypto.randomUUID(),name:el("name").value.trim(),category:el("category").value,detail:el("detail").value.trim(),sets:el("sets").value.trim(),intensity:el("intensity").value.trim(),rest:el("rest").value.trim(),duration:el("duration").value.trim(),target:el("target").value.trim(),caution:el("caution").value.trim()}
}
async function saveMenuDoc(m){
 if(cloud)await db.collection("teams").doc(TEAM_ID).collection("menus").doc(m.id).set({...m,updatedBy:currentUpdaterName(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 const i=menus.findIndex(x=>x.id===m.id);if(i>=0)menus[i]=m;else menus.push(m);localSave();renderAll();markSaved();
}
el("saveMenu").onclick=async()=>{if(!canEditApp())return alert("閲覧専用アカウントでは編集できません。");const m=menuFormData();if(!m.name)return alert("メニュー名を入力してください");try{await saveMenuDoc(m);resetMenu();nav("menus");setTimeout(()=>el("menuList").scrollIntoView({behavior:"smooth",block:"start"}),50)}catch(e){console.error(e);alert("メニューの保存に失敗しました。通信状態を確認してください。")}}
function resetMenu(){["editId","name","detail","sets","intensity","rest","duration","target","caution"].forEach(i=>el(i).value="");el("category").value=CATS[0];el("formTitle").textContent="メニュー登録・編集"}
el("resetMenu").onclick=resetMenu;
window.editMenu=id=>{const m=menus.find(x=>x.id===id);if(!m)return;Object.entries({editId:m.id,name:m.name,category:m.category,detail:m.detail,sets:m.sets,intensity:m.intensity,rest:m.rest,duration:m.duration,target:m.target,caution:m.caution}).forEach(([k,v])=>el(k).value=v||"");el("formTitle").textContent="メニュー編集";nav("menus");setTimeout(()=>el("formTitle").scrollIntoView({behavior:"smooth",block:"start"}),50)}
window.deleteMenu=async id=>{if(!canEditApp())return alert("閲覧専用アカウントでは削除できません。");const m=menus.find(x=>x.id===id);if(!m||!confirm("削除しますか？"))return;menus=menus.filter(x=>x.id!==id);Object.entries(days).forEach(([date,d])=>{d=normalizeDay(d);SECTIONS.forEach(s=>d.sections[s.id]=d.sections[s.id].filter(x=>x!==id));days[date]=d});localSave();renderAll();if(cloud){await db.collection("teams").doc(TEAM_ID).collection("menus").doc(id).delete();const batch=db.batch();Object.entries(days).forEach(([date,d])=>batch.set(db.collection("teams").doc(TEAM_ID).collection("days").doc(date),d,{merge:true}));await batch.commit()}markSaved("削除済み")}

function loadWeek(){weekDraft={};for(let i=0;i<7;i++){const d=addDays(weekStart,i);weekDraft[d]=normalizeDay(days[d])}weekDirty=false}
function renderWeek(){
 weekStart=getMonday(weekStart);
 const dates=Array.from({length:7},(_,i)=>addDays(weekStart,i));
 dates.forEach(d=>{
  weekDraft[d]=normalizeDay(weekDraft[d]||days[d]);
 });
 el("weekDate").value=weekStart;
 el("weekTitle").textContent=`${dates[0]} ～ ${dates[6]}（月〜日）`;
 el("weekHead").innerHTML=`<tr><th>区分</th>${dates.map(d=>`<th>${parseISO(d).toLocaleDateString("ja-JP",{timeZone:"UTC",month:"numeric",day:"numeric",weekday:"short"})}<input value="${esc(weekDraft[d].theme||"")}" placeholder="テーマ" onchange="setWeekTheme('${d}',this.value)" style="margin-top:5px;font-size:12px"></th>`).join("")}</tr>`;
 el("weekBody").innerHTML=SECTIONS.map(s=>`<tr><th class="${cls(s.cat)}">${esc(s.label)}</th>${dates.map(d=>{const ids=weekDraft[d].sections[s.id]||[];return `<td><div class="weekcell ${cls(s.cat)}"><div class="picker"><select id="w-${d}-${s.id}">${optionHTML(s)}</select><button class="btn primary small" onclick="addWeek('${d}','${s.id}')">追加</button></div>${ids.map((id,i)=>{const m=menus.find(x=>x.id===id);return m?`<div class="weekitem ${cls(m.category)}"><span>${esc(m.name)}</span><button class="x" onclick="removeWeek('${d}','${s.id}',${i})">×</button></div>`:""}).join("")}</div></td>`}).join("")}</tr>`).join("")
}
window.addWeek=(d,s)=>{const p=el(`w-${d}-${s}`);if(p.value){weekDraft[d].sections[s].push(p.value);weekDirty=true;renderWeek()}}
window.removeWeek=(d,s,i)=>{weekDraft[d].sections[s].splice(i,1);weekDirty=true;renderWeek()}
window.setWeekTheme=(d,v)=>{weekDraft[d].theme=v;weekDirty=true};
function shiftWeek(n){weekStart=addDays(weekStart,n*7);loadWeek();renderWeek()}
el("prevWeek").onclick=()=>{if(confirmLeaveWithUnsaved())shiftWeek(-1)};
el("nextWeek").onclick=()=>{if(confirmLeaveWithUnsaved())shiftWeek(1)};
el("thisWeek").onclick=()=>{if(!confirmLeaveWithUnsaved())return;weekStart=getMonday(todayISO());loadWeek();renderWeek()};
el("weekDate").onfocus=e=>{previousWeekDate=e.target.value};
el("weekDate").onchange=e=>{
 if(!e.target.value)return;
 if(weekDirty&&!confirmLeaveWithUnsaved()){e.target.value=previousWeekDate||weekStart;return}
 weekStart=getMonday(e.target.value);previousWeekDate=weekStart;loadWeek();renderWeek();
}
el("saveWeek").onclick=async()=>{
 if(!canEditApp())return alert("閲覧専用アカウントでは編集できません。");
 try{
  const changed=Object.entries(weekDraft).filter(([date,d])=>dayHasContent(d)||dayHasContent(days[date]));
  const finalized=changed.map(([date,rawDay])=>[date,finalizeDayForSave(date,rawDay)]);
  if(cloud){
   const batch=db.batch();
   for(const [date,d] of finalized){
    batch.set(db.collection("teams").doc(TEAM_ID).collection("days").doc(date),{...d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
   }
   if(finalized.length)await batch.commit();
  }
  finalized.forEach(([date,d])=>days[date]=normalizeDay(d));
  weekDirty=false;localSave();renderAll();markSaved();alert("1週間を保存しました");
 }catch(e){console.error(e);alert("1週間の保存に失敗しました。通信状態を確認してください。")}
}

function monthDates(month){
 const [y,m]=month.split("-").map(Number);
 const last=new Date(Date.UTC(y,m,0)).getUTCDate();
 return Array.from({length:last},(_,i)=>`${y}-${String(m).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`);
}
function loadMonth(){monthDraft={};monthDates(monthCursor).forEach(d=>monthDraft[d]=normalizeDay(days[d]));monthDirty=false}
function renderMonth(){
 const dates=monthDates(monthCursor);
 if(!Object.keys(monthDraft).length||!monthDraft[dates[0]])loadMonth();
 el("monthDate").value=monthCursor;
 const [y,m]=monthCursor.split("-").map(Number);
 el("monthTitle").textContent=`${y}年${m}月（月曜始まり）`;
 const firstOffset=(parseISO(dates[0]).getUTCDay()+6)%7;
 const weekdays=["月","火","水","木","金","土","日"].map(w=>`<div class="month-weekday">${w}</div>`).join("");
 const blanks=Array.from({length:firstOffset},()=>`<div class="month-day other"></div>`).join("");
 const cells=dates.map(d=>{
  const day=monthDraft[d]||blankDay();
  const count=SECTIONS.reduce((n,s)=>n+(day.sections?.[s.id]?.length||0),0);
  return `<div class="month-day ${dayHasContent(day)?"has-data":""}">
   <div class="month-day-head"><span class="month-day-number">${Number(d.slice(-2))}日</span>${count?`<span class="month-day-count">${count}件</span>`:""}</div>
   <input value="${esc(day.theme||"")}" placeholder="テーマ" oninput="setMonthTheme('${d}',this.value)">
   <textarea placeholder="連絡事項" oninput="setMonthNotes('${d}',this.value)">${esc(day.notes||"")}</textarea>
   <button class="btn secondary small" onclick="openMonthDay('${d}')">1日入力を開く</button>
  </div>`;
 }).join("");
 el("monthGrid").innerHTML=weekdays+blanks+cells;
}
window.setMonthTheme=(d,v)=>{monthDraft[d].theme=v;monthDirty=true};
window.setMonthNotes=(d,v)=>{monthDraft[d].notes=v;monthDirty=true};
window.openMonthDay=d=>{if(!nav("daily"))return;el("dailyDate").value=d;loadDay(d)};
function shiftMonth(n){const [y,m]=monthCursor.split("-").map(Number);const d=new Date(Date.UTC(y,m-1+n,1));monthCursor=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`;loadMonth();renderMonth()}
el("prevMonth").onclick=()=>{if(confirmLeaveWithUnsaved())shiftMonth(-1)};
el("nextMonth").onclick=()=>{if(confirmLeaveWithUnsaved())shiftMonth(1)};
el("thisMonth").onclick=()=>{if(!confirmLeaveWithUnsaved())return;monthCursor=todayISO().slice(0,7);loadMonth();renderMonth()};
el("monthDate").onfocus=e=>{previousMonthDate=e.target.value};
el("monthDate").onchange=e=>{
 if(!e.target.value)return;
 if(monthDirty&&!confirmLeaveWithUnsaved()){e.target.value=previousMonthDate||monthCursor;return}
 monthCursor=e.target.value;previousMonthDate=monthCursor;loadMonth();renderMonth();
};
el("saveMonth").onclick=async()=>{
 if(!canEditApp())return alert("閲覧専用アカウントでは編集できません。");
 try{
  const changed=Object.entries(monthDraft).filter(([date,d])=>dayHasContent(d)||dayHasContent(days[date]));
  const finalized=changed.map(([date,rawDay])=>[date,finalizeDayForSave(date,rawDay)]);
  if(cloud){
   const batch=db.batch();
   finalized.forEach(([date,d])=>{
    batch.set(db.collection("teams").doc(TEAM_ID).collection("days").doc(date),{...d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
   });
   if(finalized.length)await batch.commit();
  }
  finalized.forEach(([date,d])=>days[date]=normalizeDay(d));
  monthDirty=false;localSave();renderAll();markSaved("1か月保存済み");alert("1か月を保存しました");
 }catch(e){console.error(e);alert("1か月の保存に失敗しました。通信状態を確認してください。")}
};

function renderAll(){renderMenus();renderDaily();renderToday();renderWeek();renderMonth();applyRoleUI()}
function configured(){return window.FIREBASE_CONFIG?.apiKey&&!String(window.FIREBASE_CONFIG.apiKey).includes("ここに")}
function startRealtime(){
 if(unsubMenus)unsubMenus();if(unsubDays)unsubDays();
 unsubMenus=db.collection("teams").doc(TEAM_ID).collection("menus").onSnapshot(s=>{menus=migrateMenuCategories(s.docs.map(d=>({id:d.id,...d.data()})));localSave();renderAll()},e=>setStatus("メニュー読込エラー","offline"));
 unsubDays=db.collection("teams").doc(TEAM_ID).collection("days").onSnapshot(s=>{
  days={};s.docs.forEach(d=>days[d.id]=normalizeDay(d.data()));localSave();
  if(!dailyDirty)loadDay(el("dailyDate").value);
  if(!weekDirty)loadWeek();
  if(!monthDirty)loadMonth();
  renderAll();
 },e=>setStatus("練習読込エラー","offline"));
}

async function syncStarterMenus(){
 // 初期導入時だけ登録。削除した標準メニューを次回ログインで復活させない。
 if(!cloud||!user||!canEditApp())return;
 const snap=await db.collection("teams").doc(TEAM_ID).collection("menus").limit(1).get();
 if(!snap.empty)return;
 const batch=db.batch();
 STARTER_MENUS.forEach(m=>{
  const ref=db.collection("teams").doc(TEAM_ID).collection("menus").doc(m.id);
  batch.set(ref,{...m,updatedBy:currentUpdaterName(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 });
 await batch.commit();
 markSaved(`${STARTER_MENUS.length}件の初期メニューを登録`);
}


window.addEventListener("beforeunload",event=>{
 if(allowUnload||!hasUnsavedChanges())return;
 event.preventDefault();
 event.returnValue="";
});

async function init(){
 menus=migrateMenuCategories(JSON.parse(localStorage.getItem("coachMenus")||"[]"));days=normalizeDaysMap(JSON.parse(localStorage.getItem("coachDays")||"{}"));if(!menus.length)menus=structuredClone(STARTER_MENUS);
 fillBasics();el("todayDate").value=todayISO();el("dailyDate").value=todayISO();el("weekDate").value=weekStart;el("monthDate").value=monthCursor;previousDailyDate=todayISO();previousWeekDate=weekStart;previousMonthDate=monthCursor;loadDay(todayISO());loadWeek();loadMonth();renderAll();
 if(!configured()){setStatus("未接続・端末保存","offline");return}
 try{
  firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();cloud=true;
  auth.onAuthStateChanged(async u=>{
   user=u;
   if(u){
    el("login").classList.add("hidden");el("logout").style.display="";setStatus("権限確認中","");el("savestatus").textContent="ユーザー情報を確認中";
    await loadCurrentRole();
    startRealtime();
    try{await syncStarterMenus()}catch(e){console.error("starter menu sync error",e)}
    setStatus("リアルタイム接続","online");
   }else{
    currentRole=null;currentDisplayName="";memberNameMap={};applyRoleUI();refreshUserText();el("login").classList.remove("hidden");el("logout").style.display="none";setStatus("ログイン待ち","");
   }
  })
 }catch(e){console.error(e);setStatus("接続エラー","offline")}
}
el("loginBtn").onclick=async()=>{
 const loginEmail=loginIdToEmail(el("loginId").value);
 if(!loginEmail){
  el("loginMsg").textContent="ユーザー名は半角英数字・ピリオド・ハイフン・アンダーバーで3文字以上にしてください。";
  return;
 }
 try{
  el("loginMsg").textContent="ログイン中";
  await auth.signInWithEmailAndPassword(loginEmail,el("password").value);
  el("loginMsg").textContent="";
 }catch(e){
  el("loginMsg").textContent="ユーザー名・メールアドレスまたはパスワードが違います。";
 }
}
el("logout").onclick=async()=>{
 if(!confirmLeaveWithUnsaved())return;
 allowUnload=true;
 try{await auth.signOut()}finally{allowUnload=false}
};

el("loginId").addEventListener("keydown",e=>{
 if(e.key==="Enter") el("password").focus();
});
el("password").addEventListener("keydown",e=>{
 if(e.key==="Enter") el("loginBtn").click();
});

init();
</script>
